name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Moods Lambda
        run: |
          python -m py_compile backend/moods-api/lambda_function.py

      - name: Compile Image Lambda
        run: |
          python -m py_compile backend/image-api/lambda_function.py


  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/MoodYourself

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/MoodYourself/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build